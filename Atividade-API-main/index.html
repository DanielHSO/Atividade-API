<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SearchHere</title>
    <link rel="stylesheet" href="assets/css/css.css">
</head>
<body>

    </main>
    <main>

        <section class="titulo">
            <div class="titulo">
               <div class="imagem">
                    <img src="assets/images/rosa-dos-ventos.webp" alt="">
               </div>
                 <h1>SearchHere</h1>
            </div>
        </section>
        <section id="buscar">
            <div class="buscar-1">
                <p>CEP:</p>
                <input type="text" id="cep" placeholder="Digite seu Cep">  
            </div>
            <div class="botaozinho">
                <button class="botao" onclick="BuscarCep()">BUSCAR</button>
            </div>
            <div id="DivResultado"></div>
            
        </section>
        <script>
            async function BuscarCep() {
                let cep = document.getElementById('cep').value;
                const resultado = document.getElementById('DivResultado');
                cep = cep.replace(/\D/g, '');

                if (cep.length !== 8) {
                    resultado.style.display = 'block';
                    resultado.innerHTML = '<p style="color: red;">Por favor digite um CEP válido.</p>';
                    return;
                }

                try{
                    const resposta = await fetch(`https://viacep.com.br/ws/${cep}/json/`);
                    const dados = await resposta.json();

                    if (dados.erro) {
                        resultado.innerHTML = '<p style="color: red;">CEP não encontrado </p>';

                    } else {
                        resultado.innerHTML = `
                        <p><strong>Rua:</strong> ${dados.logradouro}</p>
                        <p><strong>Bairro:</strong> ${dados.bairro}</p>
                        <p><strong>Cidade/UF:</strong> ${dados.localidade} - ${dados.uf}</p>
                        <p><strong>DDD:</strong> ${dados.ddd}</p>`;
                    }
                }  catch (erro) { 
                    resultado.innerHTML = '<p style="color: red;">Erro na requisição.</p>';
                }
            }
        </script>
    </main>
</body>
</html>
